camera:
  url: "http://192.168.1.82:81/stream"
  width: 640
  height: 480
  fps: 30
  buffer_size: 10
  transport: "udp"  # udp or tcp
  reconnect_delay: 1.0  # initial reconnect delay (seconds)
  max_reconnect_delay: 60.0

model:
  path: "models/day_evening_night_clear_cloudy_partly_cloudy_classifier_20240923.h5"
  input_size: 150
  type: "single_6class"  # single_6class or dual_head

inference:
  frame_skip: 5  # predict every N frames
  smoothing_window: 5  # moving average window size
  confidence_threshold: 0.0  # minimum confidence to display (0.0 = show all)

display:
  width: 640
  height: 480
  font_scale: 1.5
  font_thickness: 3
  color_time: [0, 255, 0]  # BGR
  color_weather: [0, 255, 0]  # BGR

record:
  enabled: false
  output_path: "output.avi"
  codec: "XVID"
  fps: 20.0

labels:
  time: ["Day", "Evening", "Night"]
  weather: ["Clear", "Cloudy", "Partly Cloudy"]
