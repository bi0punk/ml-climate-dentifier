camera:
  url: "${RTSP_URL}"  # set RTSP_URL env var: rtsp://user:pass@host:port/path
  width: 640
  height: 480
  fps: 30
  buffer_size: 10
  transport: "tcp"  # udp or tcp
  reconnect_delay: 1.0  # initial reconnect delay (seconds)
  max_reconnect_delay: 60.0

crop:
  enabled: true
  region: "bottom_half"  # bottom_half: toma solo la mitad inferior del frame (cámara dual-lens)

model:
  path: "models/weather_classifier_20260714_020842.h5"
  input_size: 150
  type: "dual_head"  # single_6class or dual_head

inference:
  frame_skip: 5  # predict every N frames
  smoothing_window: 5  # moving average window size
  confidence_threshold: 0.0  # minimum confidence to display (0.0 = show all)

display:
  width: 640
  height: 480
  font_scale: 1.5
  font_thickness: 3
  color_time: [0, 255, 0]  # BGR
  color_weather: [0, 255, 0]  # BGR

record:
  enabled: false
  output_path: "output.avi"
  codec: "XVID"
  fps: 20.0

labels:
  time: ["Day", "Evening", "Night"]
  weather: ["Clear", "Cloudy", "Partly Cloudy"]
