[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-climate-dentifier"
version = "2.0.0"
description = "IP Camera Weather and Time Classifier using CNN"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "tensorflow>=2.20",
    "matplotlib",
    "scikit-learn",
    "python-dotenv",
    "pyyaml",
    "seaborn",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff>=0.6",
    "mypy",
    "bandit",
    "vulture",
    "radon",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.vulture]
min_confidence = 60
ignore_names = [
    "confidence_threshold",
    "on_epoch_end",
    "trainable",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
